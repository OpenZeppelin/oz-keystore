---
version: 2
# opt in to updates for ecosystems that are not yet GA.
enable-beta-ecosystems: true
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 15 2 1 * *
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps): '

  # Maintain dependencies for Cargo
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: 15 3 1 * *
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - dependabot
      - dependencies
    open-pull-requests-limit: 5
